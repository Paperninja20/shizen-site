<style>
/* ===========================================================================
   The channel menu.

   The reference is the Wii's system menu, and the parts worth copying are
   structural rather than decorative: a cool, near-neutral shell that stays
   out of the way, and inside it a grid of tiles where each one is allowed to
   look like nothing else on the page. That is exactly the shape this site
   needs - the shell belongs to the label, and each product brings its own
   world into its own tile.

   So the chrome here is deliberately NOT washi. Shizen's tile is washi,
   because Shizen is. A sample pack's tile will be whatever that pack is.
   Making the shell warm too would flatten the one distinction the layout
   exists to draw.

   Type is Baumans throughout - see --font-ui. One face, one request, and
   one weight, which is all Baumans ships.
   ======================================================================== */

:root {
  /* Sampled off a screenshot of the real menu rather than guessed:
       ground  #e6e6e6   neutral grey, NOT blue-tinted
       dock    #d2d3da   darker and slightly cool
       line    (78,182,217) on the divider and the button rings
       tile    pure white inside a neutral grey hairline, (183,183,183)
     The ground being neutral is the biggest single correction - the old
     #eceff1 was reading cold and washed next to it. */
  /* The pinstripe LIFTS the average: one 1px line of --shell-line every 3px
     over --shell renders as (line + 2*shell)/3. Setting --shell to the
     reference's #e6e6e6 therefore measured #e9e9e9 on screen. These two are
     picked so the rendered average lands on #e6e6e6 instead. */
  --shell:       #e3e3e3;
  --shell-line:  #ededed;
  --dock:        #d2d3da;

  --tile:        #ffffff;
  --tile-edge:   #b7b7b7;         /* the hairline the real channels carry */
  --glow:        140, 205, 232;   /* the cyan bloom, as rgb parts */

  --wii-blue:    #3aabd2;
  --wii-line:    #4eb6d9;

  --ink:         #5a5f63;
  --ink-soft:    #8e9398;

  /* ONE face for the whole shell: wordmark, clock, tile names, knobs, the
     lot. Comfortaa is rounded geometric under the OFL, so it can be served,
     and weights are numbers rather than separate files - which is what made
     "bold again" a one-character change instead of another font hunt.

     Segoe UI and Zen Kurenaido are both gone from this page. Segoe only ever
     reached Windows visitors anyway, since its license bars serving it, so
     it was quietly giving two audiences two different pages. */
  --font-ui:     'Baumans', 'Avenir Next', 'Century Gothic', system-ui, sans-serif;
  --font-mark:   var(--font-ui);


  --dock-h:      230px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

/* The set. Near-black rather than black: a CRT bezel is moulded plastic and
   catches a little light, and true black makes the screen's own dark corners
   disappear into it. */
body {
  margin: 0;
  background: #0d0e10;
  font-family: var(--font-ui);
  color: var(--ink);
  min-height: 100%;
}

.tv {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: clamp(10px, 2.6vmin, 38px);
  padding-top: calc(clamp(10px, 2.6vmin, 38px) + env(safe-area-inset-top, 0px));
  padding-bottom: calc(clamp(10px, 2.6vmin, 38px) + env(safe-area-inset-bottom, 0px));
}

/* The screen. position:relative because everything that used to be fixed to
   the viewport is now absolute to THIS - the dock and the beats sheet both
   belong to the picture, not to the page around it.
   overflow:hidden is what makes the corners a screen edge rather than a
   rounded div with content leaking past it. */
.screen {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  border-radius: clamp(10px, 1.8vmin, 26px);
  display: flex;
  flex-direction: column;

  /* Flat colour with a 1-in-3px horizontal pinstripe over it. A repeating
     gradient is not shading - every stop is a hard stop, so it renders as
     lines rather than a fade. */
  background-color: var(--shell);
  background-image: repeating-linear-gradient(
      to bottom,
      var(--shell-line) 0px,
      var(--shell-line) 1px,
      transparent 1px,
      transparent 3px);

  /* The tube sits inside the moulding, so the bezel throws a shadow onto it
     and the glass throws one back out. */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.14),
    inset 0 0 60px rgba(0,0,0,0.30),
    0 0 0 clamp(6px, 1.2vmin, 14px) #17181b,
    0 0 0 clamp(7px, 1.4vmin, 16px) rgba(255,255,255,0.05),
    0 18px 60px rgba(0,0,0,0.7);
}

/* The picture itself: a grille, scanlines and a vignette, in that order.
   Deliberately faint - the reference is a blue test card with nothing to
   read, and this has a UI under it. All of it is tunable in one place. */
.crt {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 50;
  background:
    repeating-linear-gradient(90deg,
      rgba(255,0,0,0.035) 0px, rgba(255,0,0,0.035) 1px,
      rgba(0,255,0,0.035) 1px, rgba(0,255,0,0.035) 2px,
      rgba(0,80,255,0.035) 2px, rgba(0,80,255,0.035) 3px),
    repeating-linear-gradient(0deg,
      rgba(0,0,0,0.085) 0px, rgba(0,0,0,0.085) 1px,
      transparent 1px, transparent 3px),
    /* The phosphor cast, LAST in the stack so it sits under the grille and
       tints what shows through rather than colouring the grille itself. A
       flat wash rather than a blend mode: soft-light and screen both lift
       the blacks, and the vignette below depends on those staying dark. */
    linear-gradient(rgba(58,146,214,0.085), rgba(58,146,214,0.085));
}
.crt::after {
  content: "";
  position: absolute; inset: 0;
  /* Wider than the box on purpose, so the darkening is a corner falloff
     rather than a ring sitting inside the edges. Stronger than it was, and
     the dark end carries blue rather than grey so the corners go the way a
     tube's do. */
  background: radial-gradient(122% 102% at 50% 50%,
              transparent 44%, rgba(8,20,38,0.50) 100%);
}

@media (prefers-reduced-motion: reduce) {
  .crt { display: none; }
}

/* --- head ---------------------------------------------------------------- */

.head {
  position: relative; z-index: 2;
  display: flex; align-items: baseline; justify-content: center;
  gap: 18px;
  padding: 30px 26px 4px;
}

.wordmark {
  font-family: var(--font-mark);
  /* Baumans has a single weight (400). font-weight:700 would make the
     browser SYNTHESISE a bold by smearing the outlines, which on a
     geometric display face looks like a printing fault. Left at 400; the
     face is heavy enough at size to carry the title. */
  font-weight: 400;
  font-size: clamp(1.9rem, 4.4vw, 3rem);
  /* letter-spacing adds a trailing space after the LAST character, which
     shifts a centred line left by half the tracking. A matching text-indent
     puts it back - the same fix the Shizen page carries. */
  letter-spacing: 0.04em;
  text-indent: 0.04em;
  margin: 0;
  color: var(--ink);
}

/* The wordmark took the clock's place, straddling the curve the way the
   time did: the name in the light above it, the date in the grey below.
   The curve's middle is at y=106 of a 230 viewBox, 46.1% down the dock, and
   the name's box ends there. */
.clock {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  top: 0;
  text-align: center;
  color: var(--ink-soft);
  pointer-events: none;
  line-height: 1;
}
/* --- the letter ---------------------------------------------------------- */

/* The console's message board: a white card with a blue header, the sender
   at the top and ruled paper under the writing. Sized to content rather than
   to the viewport, unlike the beats sheet, which has to hold a fixed-height
   iframe. */
.sheet.is-letter {
  width: min(640px, 100%);
  height: auto;
  max-height: min(84vh, 760px);
  background: #fff;
  box-shadow: 0 0 0 1px #9aa0a5,
              inset 0 0 0 3px #f4f5f6,
              0 18px 48px rgba(20,40,55,0.34);
}

.letter-head {
  flex: none;
  background: linear-gradient(180deg, #6ec9ef 0%, #54b8e6 100%);
  color: #fff;
  text-align: center;
  font-size: 1.25rem;
  padding: 13px 18px;
  border-radius: 8px 8px 0 0;
  text-shadow: 0 1px 1px rgba(20,60,90,0.25);
}

.letter-body { overflow-y: auto; padding: 20px clamp(18px, 3vw, 30px) 10px; }

.letter-from { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.letter-avatar {
  flex: none;
  width: 54px; height: 54px;
  border-radius: 10px;
  display: grid; place-items: center;
  color: #6b7a84;
  background: #eef3f6;
  box-shadow: inset 0 0 0 1px #cfd8de;
}
.letter-avatar svg { width: 34px; height: 34px; }
.letter-name { font-size: 1.05rem; color: var(--ink); }

/* Ruled paper. The gradient's period and the text's line-height are the SAME
   number on purpose - 2.1rem - which is the only thing that keeps the
   writing sitting on the lines instead of drifting off them a paragraph in.
   Change one and the other has to move with it. */
.letter-text {
  line-height: 2.1rem;
  font-size: 1rem;
  color: var(--ink);
  background-image: repeating-linear-gradient(
      to bottom,
      transparent 0, transparent calc(2.1rem - 1px),
      #dbe8f0 calc(2.1rem - 1px), #dbe8f0 2.1rem);
  padding-bottom: 2.1rem;
}
.letter-text p { margin: 0 0 2.1rem; }
.letter-text p:last-child { margin-bottom: 0; }

.letter-foot {
  flex: none;
  display: flex; justify-content: center;
  padding: 14px 18px 18px;
}
.letter-btn {
  font: inherit;
  font-size: 1.05rem;
  padding: 10px 34px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  color: var(--ink-soft);
  background: linear-gradient(180deg, #f4f6f7 0%, #e3e6ea 52%, #d2d6db 100%);
  box-shadow:
    inset 0 0 0 3px var(--wii-line),
    inset 0 2px 2px rgba(255,255,255,0.9),
    0 3px 6px rgba(40,56,68,0.18);
  transition: transform 140ms ease, box-shadow 140ms ease,
              background 140ms ease, color 140ms ease;
}
.letter-btn:hover, .letter-btn:focus-visible {
  transform: translateY(-2px);
  color: var(--wii-blue);
  background: linear-gradient(180deg, #ffffff 0%, #f2f7fa 55%, #e4edf3 100%);
  box-shadow:
    inset 0 0 0 3px var(--wii-blue),
    inset 0 2px 2px rgba(255,255,255,0.9),
    0 5px 10px rgba(40,56,68,0.2),
    0 0 12px 4px rgba(var(--glow), 0.55);
  outline: none;
}

/* In the grey below the curve, where the date used to be. .clock is already
   centred on the dock, so these inherit that and only need their own
   vertical placement.
   pointer-events comes back ON: .clock turns it off so the name cannot
   swallow clicks, and these are the one thing inside it meant to take them. */
.socials {
  display: flex; justify-content: center;
  gap: 20px;
  margin-top: 62px;
}
.social {
  pointer-events: auto;
  width: 60px; height: 60px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--ink-soft);
  /* The dock buttons' treatment at half the size - same gradient, a 3px
     ring rather than 4 so they do not out-weigh the knobs beside them. */
  background: linear-gradient(180deg, #f4f6f7 0%, #e3e6ea 52%, #d2d6db 100%);
  box-shadow:
    inset 0 0 0 3px var(--wii-line),
    inset 0 2px 2px rgba(255,255,255,0.9),
    0 3px 6px rgba(40,56,68,0.18),
    0 1px 2px rgba(40,56,68,0.12);
  transition: transform 140ms ease, box-shadow 140ms ease,
              background 140ms ease, color 140ms ease;
}
.social:hover, .social:focus-visible {
  transform: translateY(-2px);
  color: var(--wii-blue);
  background: linear-gradient(180deg, #ffffff 0%, #f2f7fa 55%, #e4edf3 100%);
  box-shadow:
    inset 0 0 0 3px var(--wii-blue),
    inset 0 2px 2px rgba(255,255,255,0.9),
    0 5px 10px rgba(40,56,68,0.2),
    0 0 12px 4px rgba(var(--glow), 0.55);
  outline: none;
}
.social svg { width: 28px; height: 28px; display: block; }

@media (max-width: 560px) {
  /* The two labels and the three socials cannot share this width: at 390px
     "Beats" and "About me" ran into the icons. The knobs' icons say what
     they are. */
  .dock-label { display: none; }
  .socials { gap: 14px; margin-top: 44px; }
  .social { width: 48px; height: 48px; }
  .social svg { width: 23px; height: 23px; }
}

.clock .wordmark {
  font-size: clamp(2.7rem, 5.9vw, 4.3rem);
  /* Pushes it down so the baseline lands just above the curve. Less than it
     was, which is what lifts it - the bigger size would otherwise have eaten
     the gap from the other end. */
  padding-top: 6px;
  text-shadow: none;
}


/* --- the grid ------------------------------------------------------------ */

/* Back to the top, not centred in the leftover space.
   The top padding is not zero, though: the old layout got its gap from the
   standfirst that used to sit here - 4px of header padding, a ~16px line and
   a 20px margin. Deleting the text deleted the gap with it, so ~36px stands
   in for what the words were doing. */
.menu {
  position: relative; z-index: 2;
  flex: 1;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  /* No header any more, so the grid centres in what the dock leaves rather
     than hanging from the top. */
  padding: clamp(18px, 3vh, 30px) 26px calc(var(--dock-h) + 26px);
  display: flex;
  flex-direction: column;
  /* Scrolls when the tiles do not fit above the dock - with two products
     that happens on a tablet held upright. The centring is the grid's own
     margin:auto rather than justify-content:center, because a centred flex
     child that overflows loses its TOP past the edge, where no scroll can
     reach it. */
  overflow-y: auto;
  overscroll-behavior: contain;
}

.grid {
  width: 100%;
  margin-block: auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

/* A channel is 16:10 because that is the console's own tile, and because a
   shape wider than it is tall reads as a screen rather than an app icon. */
.channel {
  position: relative;
  aspect-ratio: 16 / 10;
  border-radius: 17px;
  /* A transformed element with overflow:hidden does not always keep its
     rounded clip: the browser composites the scaled layer and the square
     corners of the content come back. Promoting it up front means the clip
     is rasterised WITH the radius, and the radius is repeated on the art
     inside so it survives either way. Only .is-live transforms, so only it
     is promoted - twelve promoted layers for eleven tiles that never move
     would be waste. */
  background: var(--tile);
  /* Three stacked shadows, same hue, widening and weakening. One shadow
     gives a hard-edged halo; stacking them is what makes it read as bloom.
     No inset highlight, no border: the glow IS the edge. */
  /* Hairline first, then the bloom outside it. The reference's channels are
     bordered rather than glowing; keeping both puts the edge back without
     losing the look that was asked for earlier. */
  box-shadow:
    0 0 0 1px var(--tile-edge),
    0 0 5px  1px rgba(var(--glow), 0.55),
    0 0 15px 5px rgba(var(--glow), 0.34),
    0 0 32px 13px rgba(var(--glow), 0.18);
  overflow: hidden;
  display: block;
  text-decoration: none;
  color: inherit;
  transition: transform 160ms ease, box-shadow 160ms ease;
}

/* An empty slot keeps the white plate and loses most of the bloom. Dimming
   the glow rather than greying the fill is what keeps the shelf reading as
   slots waiting to be filled instead of as tiles that failed to load. */
.channel.is-soon {
  box-shadow:
    0 0 0 1px var(--tile-edge),
    0 0 4px  1px rgba(var(--glow), 0.22),
    0 0 12px 4px rgba(var(--glow), 0.11);
}

/* Only a channel that GOES somewhere reacts. An empty slot on the console is
   inert too, and a hoverable placeholder promises a page that does not
   exist. */
.channel.is-live {
  cursor: pointer;
  will-change: transform;
  /* Each product takes a 2x2 block, so the grid is two big tiles over four
     ordinary ones rather than a flat twelve.
     The 16/10 STAYS on a spanning tile. With one product the singles beside
     it sized the rows and the big tile took its height from them; with two
     side by side there is nothing else in those rows, and without a ratio
     of their own they collapsed to a strip (measured: 1040x22). Two columns
     plus a gap at 16/10 is a few px short of two rows plus a gap, which the
     tile absorbs; nothing visible. */
  grid-column: span 2;
  grid-row: span 2;
}

.channel.is-live:hover,
.channel.is-live:focus-visible {
  transform: translateY(-5px) scale(1.018);
  box-shadow:
    0 0 0 1px var(--wii-line),
    0 0 12px 3px rgba(var(--glow), 0.70),
    0 0 30px 12px rgba(var(--glow), 0.42),
    0 0 56px 24px rgba(var(--glow), 0.20);
  outline: none;
}

.channel.is-live:active { transform: translateY(-1px) scale(1.004); }

/* The live tile's own world: the plugin actually running. */
.ch-art {
  position: absolute; inset: 0;
  background-color: #fffdf7;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: inherit;
}

/* Two layers crossfading on a 4s loop: the OG card as it is, then the
   plugin running, then back.

   The card is used WHOLE - its own wordmark, tagline and byline are in the
   image, so nothing is drawn over it. The grain overlay went for the same
   reason: the card already carries its own, and multiplying a second one
   would darken both layers.

   Only the video animates. Fading one layer against a static one is a true
   crossfade; animating both leaves them each at partial opacity mid-way and
   the washi shows through the gap between them.

   3.5s card, 1s across, 3.5s clip, 1s back - 9s round. The stops are those
   seconds as percentages of 9, not round numbers: 3.5/9 = 38.9%.

   The card here is og-card-TILE, not og-card-v5. Same artwork, paper retoned
   to the plugin's own washi: v5 sits at (244,244,236) for the light site
   page, the clip at (222,217,209), and crossfading between them made the
   paper itself brighten and cool by 22-27 levels every few seconds - a
   visible flash that read as a fault rather than a transition. The tile copy
   measures (221,216,208): one level off the clip on every channel. v5 is
   untouched and still the og:image.
   The clip plays continuously rather than starting on each fade, so it
   arrives mid-motion instead of jumping to its first frame.

   HOVER holds it on the clip. Handled in script, not CSS, because a running
   animation beats a plain opacity declaration - pausing it does not release
   the value either, so the animation has to be removed and put back. The
   transition below is what makes both directions a fade rather than a cut. */
.ch-layer {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  pointer-events: none;
  display: block;
}
.ch-clip {
  opacity: 0;
  animation: tileCross 9s ease-in-out infinite;
  transition: opacity 1s ease;
}
@keyframes tileCross {
  0%, 38.9%  { opacity: 0; }
  50%, 88.9% { opacity: 1; }
  100%       { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .ch-clip { animation: none; opacity: 0; }
}

/* An empty slot says so ONCE, on the first of them. A grid of eleven
   identical "coming soon" labels reads as eleven failures. */
.channel.is-soon .soon {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 0.72rem;
  letter-spacing: 0.18em; text-indent: 0.18em;
  text-transform: uppercase;
  color: rgba(61,74,82,0.34);
}

/* --- the dock ------------------------------------------------------------ */

.dock {
  /* absolute, not fixed: the dock belongs to the screen now. */
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: var(--dock-h);
  z-index: 3;
  pointer-events: none;
}

.dock svg.plate { position: absolute; inset: 0; width: 100%; height: 100%; }
/* Sampled down the reference's own bar: it is darkest immediately under the
   curve - (198,201,206) - and lightens to (229,231,236) about a third of the
   way down, then holds. That dark band reads as the plate catching shadow
   from the lip above it, and it is most of why the flat fill looked like
   paper rather than moulded plastic. */
.plate-fill { fill: url(#dockGrad); }
.plate-edge { fill: none; stroke: var(--wii-line); stroke-width: 3.5; }

.dock-row {
  position: absolute;
  left: 0; right: 0;
  /* The knobs were landing ~4px off the bottom of the page: the row ran to
     the dock's own edge, so centring in it left no floor. It now stops 26px
     short, and the dock is taller, which is what lifts the whole bar. */
  top: 26%;
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(16px, 3vw, 44px);
  pointer-events: none;
}

.knob {
  pointer-events: auto;
  width: 120px; height: 120px;
  border: 0; padding: 0;
  border-radius: 50%;
  display: grid; place-items: center;
  text-decoration: none;
  cursor: pointer;
  /* Light at the top, darker at the foot - the reference's buttons run
     ~243 down to ~225 and read as domed rather than printed. The ring goes
     2px -> 4px: measured on the reference it is about 6-7% of the button's
     diameter, which at 120px is nearer 8, but 4 carries the weight without
     turning the button into a washer.
     No white hairline outside the blue - it read as a seam rather than a
     highlight. A drop shadow instead, which is what lifts the button off
     the plate rather than outlining it on top of it. */
  background: linear-gradient(180deg, #f4f6f7 0%, #e3e6ea 52%, #d2d6db 100%);
  box-shadow:
    inset 0 0 0 4px var(--wii-line),
    inset 0 2px 2px rgba(255,255,255,0.9),
    0 3px 6px rgba(40,56,68,0.18),
    0 1px 2px rgba(40,56,68,0.12);
  color: var(--ink-soft);
  transition: transform 140ms ease, box-shadow 140ms ease,
              background 140ms ease, color 140ms ease;
}
.knob:hover, .knob:focus-visible {
  transform: translateY(-2px);
  color: var(--wii-blue);
  background: #fff;
  box-shadow:
    inset 0 0 0 2px var(--wii-blue),
    0 0 10px 3px rgba(var(--glow), 0.55),
    0 0 24px 9px rgba(var(--glow), 0.26);
  outline: none;
}
.knob svg.ico { width: 48px; height: 48px; display: block; }

/* A knob and its word travel together: the label is part of the control,
   so hovering or focusing either lights both. */
.dock-item {
  pointer-events: auto;
  display: flex; align-items: center; gap: 15px;
  background: none; border: 0; padding: 0;
  text-decoration: none; cursor: pointer;
  color: var(--ink-soft);
  /* font:inherit, and it is not optional. A <button> does NOT inherit
     font-family - the UA sheet gives it Arial - so "Beats" was rendering in

/* The console's system dialog: a grey plate, a hairline, hard-centred, over

.sheet-back {

  position: absolute; inset: 0; z-index: 40;
  background: rgba(40,48,54,0.38);
  display: grid; place-items: center;
  padding: clamp(12px, 4vw, 40px);
}
.sheet-back[hidden] { display: none !important; }

.sheet {
  /* Wider than the 760 the hand-built list wanted. The Blaze player is
     designed up to 1024px and gets cramped below it - still comfortably a
     dialog at this size rather than a page. */
  width: min(1000px, 100%);
  /* A DEFINITE height, not a max: the iframe below is sized in percent, and
     a percentage of an auto height resolves to nothing. */
  height: min(88vh, 860px);
  display: flex; flex-direction: column;
  background: #e8eaec;
  border-radius: 11px;
  box-shadow: 0 0 0 1px #9aa0a5,

.sheet-sub   { font-size: 0.76rem; color: var(--ink-soft); margin-top: 2px; }

.sheet-close {
  flex: none;
  width: 34px; height: 34px; border: 0; padding: 0;
  border-radius: 50%;
  background: #dfe2e6;
  box-shadow: inset 0 0 0 2px var(--wii-line);

}

/* 18px from the buy button to the sheet edge measured as "not overflowing"
   and still read as crowded. The number was right and the look was wrong, so
   this is breathing room rather than a fix. */
/* overflow:hidden, not auto. The iframe fills the body exactly and scrolls
   its OWN document, so our container never needs to - and must not, or the
   two scrollbars nest. */
.sheet-body { flex: 1; min-height: 0; overflow: hidden; padding: 0; border-radius: 0 0 11px 11px; }
.sheet-body .store-frame { display: block; width: 100%; height: 100%; border: 0; }

@media (max-width: 860px) {

     auto-placement would stack them with a column of singles down the side.
     Here each product is a wide tile across the top and the singles pair up
     below. */
  .grid { grid-template-columns: repeat(2, 1fr); gap: 13px; }

  .channel:nth-child(n+6) { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .channel, .knob { transition: none; }

<script>
// Hover holds the channel on the clip.
//
// In script rather than CSS: while tileCross is running it wins over any
// plain opacity declaration, and pausing an animation does not release the
// value it is holding - so the animation has to come off and go back on.
// Removing it lets the element's own opacity:0 apply, and the transition
// carries it to 1; leaving reverses that and only re-arms the loop once the
// fade has finished, so the card does not snap back.
[].forEach.call(document.querySelectorAll('.channel.is-live'), function (ch) {
  var clip = ch.querySelector('.ch-clip');
  if (! clip) return;             // a still tile: nothing to hold

  var timer = null;

  function hold() {
    if (timer) { clearTimeout(timer); timer = null; }
    clip.style.animation = 'none';
    // Read back before setting, or the browser folds removing the animation
    // and setting opacity into one style pass and there is nothing to
    // transition FROM.
    void clip.offsetWidth;
    clip.style.opacity = '1';
  }

  function release() {
    clip.style.opacity = '0';
    timer = setTimeout(function () {
      clip.style.animation = '';
      clip.style.opacity = '';
      timer = null;
    }, 1050);                      // just past the 1s transition
  }

  ch.addEventListener('mouseenter', hold);
  ch.addEventListener('mouseleave', release);
  ch.addEventListener('focus', hold);
  ch.addEventListener('blur', release);
});

// Both dialogs, one controller. They differ only in which three elements
// they are made of, so the behaviour - Escape, backdrop-only dismissal,
// focus out and back - is written once rather than twice.
//
// What is INSIDE the beats sheet is a cross-origin iframe this page cannot
// read or drive, which is why the dock player was removed rather than kept
// alongside it. The letter is ordinary markup.
(function () {
  function wire(openId, backId, closeId) {
    var back = document.getElementById(backId);
    var openBtn = document.getElementById(openId);
    var closeBtn = document.getElementById(closeId);
    if (! back || ! openBtn || ! closeBtn) return;

    var lastFocus = null;

    function onKey(e) { if (e.key === 'Escape') close(); }

    function open() {
      lastFocus = document.activeElement;
      back.hidden = false;
      closeBtn.focus();
      document.addEventListener('keydown', onKey);
    }

    function close() {
      back.hidden = true;
      document.removeEventListener('keydown', onKey);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    openBtn.addEventListener('click', open);
    closeBtn.addEventListener('click', close);

    // Backdrop only, and only a click that STARTED there - a drag out of the
    // sheet must not dismiss it.
    back.addEventListener('click', function (e) { if (e.target === back) close(); });
  }

  wire('beats-open', 'beats-back', 'beats-close');
  wire('about-open', 'about-back', 'about-close');
})();

</script>
