<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>LeDELAY share card</title>
<!-- The Open Graph card for /ledelay/, 1200x630. Rendered by
     tools/make-ledelay-shots.py (it drives the same offscreen WebKit harness
     as the screenshots), then installed as assets/ledelay/og-card-vN.png.
     Bump the N in the output name AND in the page's og:image when the art
     changes: link unfurlers cache by URL. -->
<style>
@font-face { font-family: "Beaver Punch"; src: url(../assets/ledelay/fonts/BeaverPunch.otf) format("opentype"); }
@font-face { font-family: "Saira"; font-weight: 400 800; src: url(../assets/ledelay/fonts/Saira-normal.woff2) format("woff2"); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #0b1730; position: relative; font-family: "Saira", sans-serif; }
.art { position: absolute; left: 560px; top: 48px; width: 700px; border: 6px solid #0a0e18; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.55); overflow: hidden; background: #0a0e18; }
.art img { width: 100%; display: block; }
.copy { position: absolute; left: 64px; top: 150px; width: 520px; }
.name { font-family: "Beaver Punch"; font-size: 118px; line-height: 1; color: #ff7a1a; -webkit-text-stroke: 5px #0a0e18; paint-order: stroke fill; text-shadow: 7px 7px 0 #0a0e18; margin: 0; }
.tag { font-family: "Beaver Punch"; font-size: 36px; color: #ffd23f; margin: 22px 0 0; line-height: 1.15; }
.by { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #b9c3d6; font-size: 18px; margin-top: 28px; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(#d8b37c, #b98f57); border-top: 5px solid #0a0e18; }
</style></head>
<body>
  <div class="copy">
    <h1 class="name">LeDELAY</h1>
    <p class="tag">The delay GOAT.</p>
    <p class="by">Jayu Sounds</p>
  </div>
  <div class="art"><img src="../assets/ledelay/hero.jpg" alt=""></div>
  <div class="floor"></div>
</body></html>
