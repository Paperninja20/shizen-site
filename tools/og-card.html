<!doctype html><meta charset="utf-8">
<!-- The Open Graph card, 1200x630 - the thumbnail Discord, iMessage and X
     render for this link. Nobody visiting the site sees it.

     TEXT ON PAPER, DELIBERATELY BARE. The fish and coral that were here are
     removed on purpose: the card is decorated by hand in Photoshop, and this
     is the plate that gets decorated. Do not add art back without asking -
     it would be painted over, or worse, doubled.
     
     The previous composition (six fish, five coral) is in git history if it
     is ever wanted back.

     NO background gradients either. The page's four watercolour blooms were
     carried over at first and read as discoloured splotches against flat
     paper - a wash under a whole scroll is four grey patches at 1200x630.

     Re-render:  tools/make-og-card.sh
     Check:      python3 tools/check-og-card.py   (15px margin)
-->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }

  /* Paper only: the scene colour with the washi grain multiplied over it. */
  body {
    position: relative;
    background-color: #f7f2e9;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: url("assets/img/washi-tile.png");
    background-size: 512px 512px;
    mix-blend-mode: multiply;
  }

  /* Centred as a block rather than pinned to a top offset, so the plate stays
     balanced if a line is added or removed. */
  .plate {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
  }
  .wordmark { width: 545px; height: auto; display: block; }
  .tagline  { width: 330px; height: auto; display: block; opacity: 0.9; }
  .byline {
    margin-top: 18px;
    font: 500 16px/1 'Avenir Next', system-ui, sans-serif;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: #4f4536; opacity: 0.6;
  }
</style>

<div class="plate">
  <img class="wordmark" src="assets/type/h1-hero-wide.svg" alt="Shizen">
  <img class="tagline"  src="assets/type/hero-tagline-wide.svg" alt="a pond that plays itself.">
  <div class="byline">Jayu Sounds</div>
</div>
